# 소스별 활성화 · 스케줄 · 소스 고유 설정
sources:
  molit_apt_trade:
    enabled: true
    schedule: "daily"
    # 국토교통부 아파트 매매 실거래가
    base_url: "http://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade"
    # 응답 형식. 이 서비스가 JSON을 지원하는지는 [확인 필요] (18. 열린 질문 1번).
    # 확인 전까지는 XML 로 둡니다. 파서는 두 형식을 모두 처리합니다.
    response_format: "xml"
    num_of_rows: 1000
    timeout_seconds: 20
    max_retries: 3
    # 요청 사이 지연(초). 일일 수집은 짧게, 백필은 아래 backfill_delay 를 씁니다.
    request_delay: 0.2
    backfill_delay: 1.0
