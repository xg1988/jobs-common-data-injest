[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line-length 는 formatter 에 맡깁니다
    "B008",
    "UP038",  # isinstance(x, (int, float)) 가 더 읽기 쉽고 빠릅니다

]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
