name: check-api

# GitHub 러너에서 공공데이터 API 에 닿는지만 1분 안에 확인합니다.
# 확인이 끝나면 이 파일은 지워도 됩니다.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-api.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 러너 위치
        run: curl -s --max-time 10 https://ipinfo.io/json || true

      - name: DNS 조회
        run: getent hosts apis.data.go.kr || echo "DNS 실패"

      - name: TCP 80 포트 열리나
        run: timeout 15 bash -c "</dev/tcp/apis.data.go.kr/80" && echo "열림" || echo "안 열림"

      - name: 실제 호출 (15초 제한)
        run: |
          curl -s -o /tmp/body.txt \
            -w "HTTP=%{http_code} 접속=%{time_connect}s 총=%{time_total}s\n" \
            --max-time 15 \
            "http://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade?serviceKey=${KEY}&LAWD_CD=11680&DEAL_YMD=202606&numOfRows=3" \
            || echo "curl 실패 (코드 $?)"
          echo "--- 응답 앞부분 ---"
          head -c 400 /tmp/body.txt || true
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
