<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실거래가 조회 — jobs-common-data-injest</title>
<style>
  :root {
    --bg:#f7f7f5; --panel:#fff; --line:#e3e3de; --ink:#1a1a17; --dim:#6b6b63;
    --ok:#1a7f4b; --warn:#a8620a; --bad:#b3261e; --accent:#2f5fd0; --accent2:#c26b1a;
    --soft:#f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#16161a; --panel:#1e1e23; --line:#31313a; --ink:#ececE8; --dim:#9a9aa2;
      --ok:#4ec98a; --warn:#e0a24a; --bad:#f2796f; --accent:#7ba3f0; --accent2:#e8a45c;
      --soft:#26262d;
    }
  }
  :root[data-theme="dark"] {
    --bg:#16161a; --panel:#1e1e23; --line:#31313a; --ink:#ececE8; --dim:#9a9aa2;
    --ok:#4ec98a; --warn:#e0a24a; --bad:#f2796f; --accent:#7ba3f0; --accent2:#e8a45c;
    --soft:#26262d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    padding:24px 16px 64px;
  }
  .wrap { max-width:1120px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 2px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 22px; }
  .sub a { color:var(--accent); }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:16px;
  }

  /* 검색 폼 */
  .form { display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:760px) { .form { grid-template-columns:repeat(4,1fr); } }
  .f { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .f label { font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  select, input {
    font:14px inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; width:100%;
  }
  select:focus, input:focus { outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);
                              outline-offset:-1px; }
  .pair { display:flex; gap:6px; align-items:center; }
  .pair input { min-width:0; }
  .pair span { color:var(--dim); font-size:12px; flex:none; }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  button {
    font:600 14px inherit; padding:9px 20px; border-radius:7px; cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
  }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:12.5px; }

  /* 요약 */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px;
          background:var(--line); border:1px solid var(--line); border-radius:10px;
          overflow:hidden; margin-bottom:16px; }
  .kpi { background:var(--panel); padding:14px 16px; }
  .kpi .k { color:var(--dim); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; }
  .kpi .v { font-size:23px; font-weight:650; margin-top:3px; letter-spacing:-.02em;
            font-variant-numeric:tabular-nums; }
  .kpi .n { color:var(--dim); font-size:11.5px; margin-top:1px; }

  /* 표 */
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line);
          white-space:nowrap; }
  th { color:var(--dim); font-weight:600; font-size:11.5px; letter-spacing:.04em;
       text-transform:uppercase; position:sticky; top:0; background:var(--panel); }
  th.s { cursor:pointer; user-select:none; }
  th.s:hover { color:var(--ink); }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr.cx td { color:var(--dim); text-decoration:line-through; }
  .scroll { overflow-x:auto; max-height:620px; overflow-y:auto; }

  .note { color:var(--dim); font-size:12.5px; margin-top:12px; line-height:1.55; }
  .note b { color:var(--ink); }
  .alert {
    padding:11px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;
    background:color-mix(in srgb, var(--bad) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--bad) 35%, transparent); color:var(--bad);
  }
  .warn {
    padding:11px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;
    background:color-mix(in srgb, var(--warn) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--warn) 35%, transparent); color:var(--warn);
  }
  .warn code, .alert code { background:transparent; border:1px solid currentColor; }
  .empty { color:var(--dim); text-align:center; padding:38px 12px; font-size:14px; }
  code { font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;
         background:var(--soft); padding:1px 5px; border-radius:4px; }
  .foot { color:var(--dim); font-size:12.5px; margin-top:26px; text-align:center; }
  .foot a { color:var(--accent); }
  .tag { font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--line);
         color:var(--dim); margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>실거래가 조회</h1>
  <p class="sub">
    국토교통부 아파트 매매 실거래가 ·
    <a href="./index.html">수집 현황</a> ·
    <a href="./swagger.html">API 문서</a>
  </p>

  <!-- 검색 -->
  <div class="card">
    <div class="form">
      <div class="f">
        <label for="sido">시도</label>
        <select id="sido"><option value="">불러오는 중…</option></select>
      </div>
      <div class="f">
        <label for="gu">시군구</label>
        <select id="gu"><option value="">먼저 시도를 고르세요</option></select>
      </div>
      <div class="f">
        <label for="from">계약일 (시작)</label>
        <input type="date" id="from">
      </div>
      <div class="f">
        <label for="to">계약일 (끝)</label>
        <input type="date" id="to">
      </div>

      <div class="f">
        <label for="apt">단지명 (일부만 써도 됩니다)</label>
        <input type="text" id="apt" placeholder="래미안">
      </div>
      <div class="f">
        <label>전용면적 ㎡</label>
        <div class="pair">
          <input type="number" id="areaMin" placeholder="59" min="0" step="1">
          <span>~</span>
          <input type="number" id="areaMax" placeholder="85" min="0" step="1">
        </div>
      </div>
      <div class="f">
        <label>거래가 (억)</label>
        <div class="pair">
          <input type="number" id="priceMin" placeholder="5" min="0" step="0.5">
          <span>~</span>
          <input type="number" id="priceMax" placeholder="20" min="0" step="0.5">
        </div>
      </div>
      <div class="f">
        <label for="canceled">해제(취소) 거래</label>
        <select id="canceled">
          <option value="exclude">제외 (권장)</option>
          <option value="include">포함</option>
          <option value="only">해제된 것만</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="go">조회</button>
      <button id="reset" class="ghost">초기화</button>
      <span class="hint" id="hint"></span>
    </div>

    <div class="note" id="coverage">담고 있는 기간을 확인하는 중…</div>
  </div>

  <div id="alert"></div>

  <!-- 결과 -->
  <div id="summary"></div>
  <div class="card" id="resultCard" style="display:none">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th class="s" data-sort="deal_date">계약일</th>
            <th>동</th>
            <th>단지</th>
            <th class="s num" data-sort="area_m2">면적 ㎡</th>
            <th class="num">층</th>
            <th class="s num" data-sort="price_manwon">거래가</th>
            <th class="s num" data-sort="unit">㎡당</th>
            <th class="num">준공</th>
            <th>유형</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="note" id="resultNote"></div>
  </div>

  <p class="foot">
    데이터: 국토교통부 실거래가 · 매일 00:10 KST 수집 ·
    <a href="https://github.com/xg1988/jobs-common-data-injest">저장소</a>
  </p>
</div>

<script>
const BASE = "https://hmsyfipqrvdfitzmuaph.supabase.co/rest/v1";
const KEY  = "sb_publishable_KxD30KDmxEqMP4dsNcLvTA_NMp1duPt";  // 읽기 전용
const RAW  = "https://raw.githubusercontent.com/xg1988/jobs-common-data-injest/main";
const SRC  = "molit_apt_trade";

//: 서버가 한 번에 주는 최대 행 수. 바꿀 수 없습니다.
//
// `limit=5000` 을 보내도 1,000행만 옵니다. 이걸 모르고 한 번만 부르면
// **조용히 잘린 결과**를 전부인 줄 알고 통계를 냅니다. 그래서 Range 로
// 페이지를 넘겨 받습니다.
const PAGE = 1000;

//: 요약을 낼 때 받아 올 최대 행 수 (= 10페이지).
//
// 중앙값을 "최근 1,000건" 으로 내면 안 됩니다. 최근순으로 자른 표본은
// 전체를 대표하지 않는데, 화면에는 그냥 "중앙값" 이라고 적히니까
// 쓰는 사람이 알 방법이 없습니다.
const MAX_ROWS = 10000;

//: 표에 실제로 그릴 행 수. 그 이상은 브라우저가 버벅입니다.
const RENDER = 1000;

const $ = id => document.getElementById(id);
const nf = n => (n ?? 0).toLocaleString("ko-KR");
// price_manwon 은 만원 단위. 그대로 보여 주면 "150000" 이 15만원으로 읽힙니다.
const eok = m => m == null ? "—" : (m / 10000).toFixed(2) + "억";

let ROWS = [];        // 마지막 조회 결과
let SORT = { key: "deal_date", dir: -1 };

// ---- 지역 목록 -----------------------------------------------------------
//
// config/regions.yml 에서 뽑아 둔 파일을 읽습니다. 화면에 목록을 손으로
// 적어 두면 행정구역이 개편될 때마다 두 벌이 어긋나고, 어긋난 쪽이
// 화면이면 "그 지역은 데이터가 없나 보다" 로 보입니다.
async function loadRegions() {
  const r = await fetch("./regions.json");
  if (!r.ok) throw new Error("regions.json 을 못 읽었습니다 (HTTP " + r.status + ")");
  const doc = await r.json();

  const sel = $("sido");
  sel.innerHTML = '<option value="">전국</option>'
    + Object.keys(doc.sido).map(s => `<option value="${s}">${s}</option>`).join("");

  sel.onchange = () => {
    const list = doc.sido[sel.value] || [];
    $("gu").innerHTML = sel.value
      ? '<option value="">' + sel.value + ' 전체</option>'
        + list.map(g => `<option value="${g.code}">${g.name}</option>`).join("")
      : '<option value="">먼저 시도를 고르세요</option>';
  };
  $("hint").textContent = `시군구 ${nf(doc.region_count)}개`;
  return doc;
}

// ---- 담고 있는 기간 ------------------------------------------------------
//
// DB 에는 최근 12개월만 있습니다. 그보다 과거를 조회하면 0건이 돌아오는데,
// 그때 거래가 없었던 게 아니라 이 테이블에 없는 것입니다. 이걸 안 적어
// 두면 "2023년엔 거래가 없었나 보다" 로 오해합니다.
let ARCHIVED = [];    // 아카이브로 넘어간 달 (YYYY-MM)

async function loadCoverage() {
  const box = $("coverage");
  try {
    const r = await fetch(`${RAW}/data/archive/${SRC}/index.json`);
    if (!r.ok) throw new Error();
    const months = Object.entries((await r.json()).months || {})
      .filter(([, v]) => v.evicted).map(([k]) => k).sort();
    ARCHIVED = months;
    if (!months.length) throw new Error();
    box.innerHTML =
      `이 화면은 <b>DB에 있는 최근 기간</b>을 조회합니다. `
    + `<b>${months[0]} ~ ${months[months.length-1]}</b> (${months.length}개월) 은 `
    + `아카이브 파일로 옮겨져 여기서는 안 나옵니다 — `
    + `<code>ingest query --from ${months[0]} --to ${months[months.length-1]}</code> 로 보세요.`;
  } catch {
    box.innerHTML =
      "이 화면은 <b>DB에 있는 최근 기간</b>을 조회합니다. "
    + "더 과거는 아카이브 파일에 있습니다 (<code>ingest query</code>).";
  }
}

// 고른 기간이 아카이브 구간과 겹치는지. 겹치면 결과가 비어 보이는
// 이유를 미리 알려 줍니다.
function archivedOverlap(from, to) {
  if (!ARCHIVED.length || !from) return [];
  const a = from.slice(0, 7), b = (to || "9999-12").slice(0, 7);
  return ARCHIVED.filter(m => m >= a && m <= b);
}

// ---- 조회 ----------------------------------------------------------------
function buildQuery() {
  const p = new URLSearchParams();
  p.set("select",
    "key,region_code,dong,apt_name,area_m2,floor,built_year,deal_date,"
  + "price_manwon,canceled,deal_type");

  const gu = $("gu").value;
  if (gu) p.append("region_code", "eq." + gu);

  const from = $("from").value, to = $("to").value;
  if (from) p.append("deal_date", "gte." + from);
  if (to)   p.append("deal_date", "lte." + to);

  const apt = $("apt").value.trim();
  // ilike 는 대소문자를 무시합니다. 양쪽에 * 를 붙여 부분 일치로.
  if (apt) p.append("apt_name", `ilike.*${apt}*`);

  const aMin = $("areaMin").value, aMax = $("areaMax").value;
  if (aMin) p.append("area_m2", "gte." + aMin);
  if (aMax) p.append("area_m2", "lte." + aMax);

  // 화면은 '억' 으로 받고 DB 는 '만원' 이라 여기서 환산합니다.
  const pMin = $("priceMin").value, pMax = $("priceMax").value;
  if (pMin) p.append("price_manwon", "gte." + Math.round(+pMin * 10000));
  if (pMax) p.append("price_manwon", "lte." + Math.round(+pMax * 10000));

  const c = $("canceled").value;
  if (c === "exclude") p.append("canceled", "is.false");
  if (c === "only")    p.append("canceled", "is.true");

  // 페이지를 넘겨 받으려면 정렬이 **유일**해야 합니다. deal_date 만으로
  // 정렬하면 같은 날짜 행들의 순서가 페이지마다 달라져, 어떤 행은 두 번
  // 오고 어떤 행은 아예 빠집니다.
  p.set("order", "deal_date.desc,key.asc");
  return p;
}

/** 조건에 맞는 행을 페이지로 나눠 받는다. (행, 전체 건수, 잘렸는지) */
async function fetchPaged(params, cap) {
  const rows = [];
  let total = 0;

  for (let offset = 0; offset < cap; offset += PAGE) {
    const res = await fetch(`${BASE}/mkt_apt_trade?${params}`, {
      headers: {
        apikey: KEY,
        "Range-Unit": "items",
        Range: `${offset}-${offset + PAGE - 1}`,
        Prefer: "count=exact",
      },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} — ${(await res.text()).slice(0,200)}`);

    total = +(res.headers.get("content-range") || "*/0").split("/").pop();
    const page = await res.json();
    rows.push(...page);
    if (!page.length || rows.length >= total) break;
  }
  return { rows, total, truncated: rows.length < total };
}

async function search() {
  $("go").disabled = true;
  $("go").textContent = "조회 중…";
  $("alert").innerHTML = "";
  $("summary").innerHTML = "";
  $("resultCard").style.display = "none";

  const overlap = archivedOverlap($("from").value, $("to").value);

  try {
    const got = await fetchPaged(buildQuery(), MAX_ROWS);
    ROWS = got.rows;

    if (overlap.length) {
      $("alert").innerHTML =
        `<div class="warn">고른 기간 중 <b>${overlap.length}개월</b>`
      + `(${overlap[0]} ~ ${overlap[overlap.length-1]})은 아카이브로 옮겨져 `
      + `<b>이 화면에서는 안 나옵니다.</b> 거래가 없었던 게 아닙니다.</div>`;
    }
    render(got.total, got.truncated);
  } catch (e) {
    $("alert").innerHTML =
      `<div class="alert"><b>조회하지 못했습니다.</b><br>${String(e.message || e)}
       <br><br>데이터가 없는 게 아니라 화면이 못 가져온 것일 수 있습니다.</div>`;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "조회";
  }
}

// ---- 결과 ----------------------------------------------------------------
function median(xs) {
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

function render(total, truncated) {
  if (!ROWS.length) {
    $("summary").innerHTML =
      `<div class="card"><div class="empty">조건에 맞는 거래가 없습니다.<br>
       <span style="font-size:12.5px">기간을 넓히거나 필터를 줄여 보세요.</span></div></div>`;
    return;
  }

  // 요약은 **취소 거래를 뺀** 값으로 냅니다. 안 그러면 취소된 신고가가
  // 최고가로 잡힙니다 (실측 2.2% 가 해제분입니다).
  //
  // 단, "해제된 것만" 을 고른 경우는 예외입니다. 그건 취소분을 보겠다고
  // 한 것이라, 거기서 또 취소분을 빼면 0건이 남아 최저가가 Infinity,
  // 최고가가 -Infinity 로 나옵니다.
  const onlyCanceled = $("canceled").value === "only";
  const live = onlyCanceled ? ROWS : ROWS.filter(r => !r.canceled);
  const prices = live.map(r => r.price_manwon);
  const units  = live.filter(r => r.area_m2 > 0)
                     .map(r => r.price_manwon / r.area_m2);

  // 필터 조합에 따라 여기가 빌 수 있습니다. Math.min([]) 은 Infinity 라
  // 화면에 "Infinity억" 이 찍힙니다.
  const lo = prices.length ? eok(Math.min(...prices)) : "—";
  const hi = prices.length ? eok(Math.max(...prices)) : "—";

  // 잘렸으면 이 숫자들은 전체가 아니라 **최근 10,000건** 기준입니다.
  // 그냥 "중앙값" 이라고 적으면 전체 중앙값으로 읽힙니다.
  const basis = truncated
    ? `최근 ${nf(live.length)}건 표본`
    : onlyCanceled
      ? `해제 거래 ${nf(live.length)}건`
      : `취소 제외 ${nf(live.length)}건`;

  $("summary").innerHTML = `<div class="kpis">
    <div class="kpi"><div class="k">거래</div><div class="v">${nf(total)}</div>
      <div class="n">${truncated ? nf(ROWS.length) + "건만 집계" : "전부 집계"}</div></div>
    <div class="kpi"><div class="k">중앙값${truncated ? "*" : ""}</div>
      <div class="v">${eok(median(prices))}</div><div class="n">${basis}</div></div>
    <div class="kpi"><div class="k">최저${truncated ? "*" : ""}</div>
      <div class="v">${lo}</div></div>
    <div class="kpi"><div class="k">최고${truncated ? "*" : ""}</div>
      <div class="v">${hi}</div></div>
    <div class="kpi"><div class="k">㎡당${truncated ? "*" : ""}</div>
      <div class="v">${units.length ? Math.round(median(units)).toLocaleString("ko-KR") : "—"}</div>
      <div class="n">만원 · 중앙값</div></div>
  </div>`;

  $("resultCard").style.display = "";
  sortAndFill();

  $("resultNote").innerHTML =
    (truncated
      ? `<b>* ${nf(total)}건 중 최근 ${nf(ROWS.length)}건만 받아왔습니다.</b> `
      + `별표가 붙은 값은 전체가 아니라 그 표본의 값입니다. `
      + `기간이나 지역을 좁히면 전체 기준으로 나옵니다. `
      : "")
  + (ROWS.length > RENDER
      ? `표에는 ${nf(RENDER)}건만 그립니다 (집계는 ${nf(ROWS.length)}건 전부). `
      : "")
  + (onlyCanceled
      ? `요약값은 <b>해제(취소)된</b> ${nf(live.length)}건 기준입니다. `
      + `이 가격들은 신고됐다가 취소된 것이라, 시세로 쓰면 안 됩니다.`
      : `요약값은 <b>해제(취소) 거래를 뺀</b> ${nf(live.length)}건 기준입니다. `
      + `취소된 신고가를 섞으면 최고가가 실제보다 높게 나옵니다.`);
}

function sortAndFill() {
  const key = SORT.key, dir = SORT.dir;
  const val = r => key === "unit"
    ? (r.area_m2 > 0 ? r.price_manwon / r.area_m2 : 0)
    : r[key];

  // 정렬은 받아 온 전부를 대상으로 하고, 그리는 건 앞쪽 일부만.
  // 1만 행을 DOM 에 넣으면 브라우저가 멈춥니다.
  const sorted = [...ROWS].sort((a, b) => {
    const x = val(a), y = val(b);
    return (x > y ? 1 : x < y ? -1 : 0) * dir;
  }).slice(0, RENDER);

  $("rows").innerHTML = sorted.map(r => `
    <tr class="${r.canceled ? "cx" : ""}">
      <td>${r.deal_date}${r.canceled ? '<span class="tag">해제</span>' : ""}</td>
      <td>${r.dong ?? ""}</td>
      <td>${r.apt_name ?? ""}</td>
      <td class="num">${r.area_m2 ?? ""}</td>
      <td class="num">${r.floor ?? ""}</td>
      <td class="num">${eok(r.price_manwon)}</td>
      <td class="num">${r.area_m2 > 0 ? Math.round(r.price_manwon / r.area_m2).toLocaleString("ko-KR") : "—"}</td>
      <td class="num">${r.built_year ?? ""}</td>
      <td>${r.deal_type ?? ""}</td>
    </tr>`).join("");
}

document.querySelectorAll("th.s").forEach(th => {
  th.onclick = () => {
    const k = th.dataset.sort;
    SORT = { key: k, dir: SORT.key === k ? -SORT.dir : -1 };
    sortAndFill();
  };
});

// ---- 시작 ----------------------------------------------------------------
$("go").onclick = search;
$("reset").onclick = () => {
  ["apt","areaMin","areaMax","priceMin","priceMax","from","to"].forEach(id => $(id).value = "");
  $("sido").value = ""; $("sido").onchange();
  $("canceled").value = "exclude";
  $("alert").innerHTML = ""; $("summary").innerHTML = "";
  $("resultCard").style.display = "none";
};

(async () => {
  // 기본 기간은 최근 3개월. 롤링 윈도우와 같아서, 처음 열었을 때
  // 나오는 화면이 "지금 확실히 있는 데이터" 가 됩니다.
  const today = new Date();
  const back  = new Date(today); back.setMonth(back.getMonth() - 3);
  const iso = d => d.toISOString().slice(0, 10);
  $("from").value = iso(back);
  $("to").value   = iso(today);

  loadCoverage();
  try {
    await loadRegions();
  } catch (e) {
    $("alert").innerHTML = `<div class="alert">${String(e.message || e)}</div>`;
    return;
  }
  search();
})();
</script>
</body>
</html>
