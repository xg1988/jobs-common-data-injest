# 실거래가 조회 대상 — 전국 시군구 전체
#
# 이 목록은 공개 행정구역 자료를 베끼지 않고, **API 를 직접 훑어서**
# 만들었습니다. 이유가 있습니다:
#
#   행정구역이 개편되면 옛 코드는 에러가 아니라 조용히 0건을 돌려줍니다.
#   "그 지역은 거래가 없구나" 로 오해해 통째로 누락됩니다.
#   실제로 2023년판 자료를 그대로 썼다면 광주+전남 25개 시군구(월 2,630건)와
#   전북 15개, 인천 4개가 전부 빠진 채 '전국 수집 완료' 로 보였을 것입니다.
#
# 이름은 API 가 돌려준 법정동 이름으로 하나씩 확인했습니다.
#   12xxx  광주(29)+전남(46) 통합  -- 계림동·풍암동(광주), 산정동·연향동(전남) 확인
#   52xxx  전북(45) 이동           -- 서신동·조촌동·부송동 확인
#   28125/28155/28275/28290  인천 분구 -- 만석동·운서동·검암동·당하동 확인
#   41192/94/96  부천 3구, 41591~97  화성 4구
#
# 목록을 바꾸기 전에 반드시 `python -m ingest run --verbose` 로
# '조회한 모든 달에서 0건인 지역' 경고를 확인하세요.
#
# 마지막 검증: 2026-08-20 (2026-06 기준, 254개)
