name: watchdog

# 수집이 멈추거나 상태가 나빠지면 알아채는 역할.
#
# 수집 자체는 GitHub 에서 못 합니다 (러너에서 apis.data.go.kr 연결이 막힘).
# 하지만 감시는 됩니다 -- 저장소의 meta.json 만 읽으면 되니까요.
#
# 문제가 있으면 이 워크플로가 실패하고, GitHub 이 저장소 주인에게 메일을 보냅니다.

on:
  schedule:
    # 밤에 난 사고를 반나절 뒤에 아는 일이 없도록 두 번 봅니다.
    # 2026-08-21 전국 전환이 00:10 에 격리됐는데 알림은 11:00 이었습니다.
    - cron: "30 16 * * *"    # 매일 01:30 KST -- 수집(00:10)·DB 갱신(00:40) 직후
    - cron: "0 2 * * *"      # 매일 11:00 KST -- 사람이 깨어 있는 시간에 한 번 더
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/watchdog.yml"   # 고치면 바로 자가 점검

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 상태 점검
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          meta = json.load(open("meta.json", encoding="utf-8"))
          problems = []

          for name, s in meta.get("sources", {}).items():
              status = s.get("status")
              fails  = s.get("consecutive_failures") or 0
              last   = s.get("last_success")

              if status != "ok":
                  problems.append(
                      f"{name}: status={status} (연속실패 {fails})\n"
                      f"         {s.get('error') or ''}")

              if fails >= 3:
                  problems.append(f"{name}: 연속 {fails}회 실패")

              if last:
                  age = datetime.now(timezone.utc) - datetime.fromisoformat(
                      last.replace("Z", "+00:00"))
                  print(f"{name}: 마지막 성공 {age.total_seconds()/3600:.1f}시간 전")
                  # 하루에 한 번 도니, 이틀 넘게 못 받으면 멈춘 것입니다.
                  if age > timedelta(days=2):
                      problems.append(
                          f"{name}: {age.days}일째 수집 성공 없음 (마지막 {last})")
              else:
                  problems.append(f"{name}: 성공한 적이 없음")

          # 아카이브는 사람이 손으로 돌립니다 (docs/SCHEDULE.md 7-1 -- 관리자 키를
          # VPS 에 두지 않으려고 일부러 자동화하지 않았습니다). 잊으면 조용히
          # 무료 한도가 찹니다. 전국 기준 19개월입니다.
          #
          # 이건 '틀린 데이터' 가 아니라 '곧 부딪힐 벽' 이라 경고로만 냅니다.
          # 여기서 실패시키면 매일 메일이 와서 진짜 사고를 가립니다.
          HOT_MONTHS = 12
          today = datetime.now(timezone(timedelta(hours=9))).date()
          cutoff = today.replace(day=1)
          for _ in range(HOT_MONTHS):
              cutoff = (cutoff - timedelta(days=1)).replace(day=1)

          for name in meta.get("sources", {}):
              path = Path("data/archive") / name / "index.json"
              months = (sorted(json.load(open(path, encoding="utf-8")).get("months", {}))
                        if path.exists() else [])
              if not months:
                  print(f"::warning title=아카이브 안 함::{name}: 아카이브한 적이 없습니다. "
                        f"DB 가 계속 커집니다 -- "
                        f"ingest archive --source {name} --hot-months {HOT_MONTHS}")
              elif months[-1] < cutoff.strftime("%Y-%m"):
                  print(f"::warning title=아카이브 밀림::{name}: 마지막 아카이브가 "
                        f"{months[-1]} 입니다. {cutoff:%Y-%m} 이전 달이 아직 DB 에 있습니다")

          if problems:
              print("\n=== 문제 ===")
              for p in problems:
                  print(" -", p)
                  print(f"::error title=수집 이상::{p.splitlines()[0]}")
              print("\nVPS 로그를 보세요:")
              print("  ssh cmn-vps 'tail -50 /opt/jobs-common-data-injest/logs/daily-*.log'")
              sys.exit(1)

          print("\n이상 없음")
          PY
