name: collect

on:
  schedule:
    - cron: "10 15 * * *"      # 00:10 KST (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 소스별로 예외를 잡으므로 한 소스가 실패해도 나머지는 계속 돕니다.
      # 종료 코드: 0=전부 ok, 1=일부 실패(커밋은 진행), 2=연속 3회 실패(알림)
      - name: run
        id: run
        continue-on-error: true
        run: python -m ingest run --all --verbose
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      - name: commit
        run: |
          git config user.name  "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ meta.json
          git diff --staged --quiet || git commit -m "collect: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      # 연속 3회 실패면 여기서 워크플로를 실패로 끝내 GitHub 알림이 가게 합니다.
      # (커밋은 이미 끝났으므로 raw/ 와 meta.json 은 저장소에 남습니다.)
      - name: alert on repeated failure
        if: steps.run.outcome == 'failure'
        run: |
          echo "수집이 실패 상태로 끝났습니다. meta.json 을 확인하세요."
          python - <<'PY'
          import json, sys
          meta = json.load(open("meta.json", encoding="utf-8"))
          bad = {
              name: e
              for name, e in meta.get("sources", {}).items()
              if e.get("status") != "ok"
          }
          for name, e in bad.items():
              print(f"::warning title={name}::{e.get('status')} / "
                    f"연속실패 {e.get('consecutive_failures')} / {e.get('error')}")
          alerting = [
              n for n, e in bad.items()
              if (e.get("consecutive_failures") or 0) >= 3
          ]
          if alerting:
              print(f"::error::연속 3회 이상 실패: {', '.join(alerting)}")
              sys.exit(1)
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check ingest tests
      - run: pytest -q
